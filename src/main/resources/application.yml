spring:
  datasource:
    url: jdbc:mysql://localhost:3306/billing_db
    username: your_username
    password: your_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    admin-secret: your_admin_secret
    manager-secret: your_manager_secret

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email
    password: your_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cloudinary:
  cloud-name: your_cloud_name
  api-key: your_api_key
  api-secret: your_api_secret


logging:
  level:
    org.springframework.security: DEBUG
